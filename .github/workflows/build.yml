name: Build APK
on: {workflow_dispatch: null, push: {branches: [main]}}
jobs: {build: {runs-on: ubuntu-latest, steps: [{name: "Get code", uses: "actions/checkout@v4"}, {name: "Setup Java", uses: "actions/setup-java@v4", with: {distribution: "zulu", java-version: "17"}}, {name: "Setup Flutter", uses: "subosito/flutter-action@v2", with: {channel: "stable"}}, {name: "Add Android platform", run: "flutter create --platforms=android --org com.perimetr --project-name perimetr_native ."}, {name: "Get dependencies", run: "flutter pub get"}, {name: "Decode app icon", run: "base64 -d assets/icon/icon.b64 > assets/icon/icon.png"}, {name: "Generate app icon", run: "dart run flutter_launcher_icons"}, {name: "Generate splash screen", run: "dart run flutter_native_splash:create"}, {name: "Configure signing", run: 'if [ -n "$KEYSTORE_BASE64" ]; then echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks; printf "storePassword=%s\nkeyPassword=%s\nkeyAlias=upload\nstoreFile=upload-keystore.jks\n" "$KEYSTORE_PASSWORD" "$KEYSTORE_PASSWORD" > android/key.properties; echo Keystore configured; else echo No keystore secret set, using debug signing; fi', env: {KEYSTORE_BASE64: "${{ secrets.KEYSTORE_BASE64 }}", KEYSTORE_PASSWORD: "${{ secrets.KEYSTORE_PASSWORD }}"}}, {name: "Build release APK", run: "flutter build apk --release --obfuscate --split-debug-info=build/debug-info"}, {name: "Build release AAB", run: "flutter build appbundle --release --obfuscate --split-debug-info=build/debug-info-aab"}, {name: "Upload APK", uses: "actions/upload-artifact@v4", with: {name: "app-release-apk", path: "build/app/outputs/flutter-apk/app-release.apk"}}, {name: "Upload AAB", uses: "actions/upload-artifact@v4", with: {name: "app-release-aab", path: "build/app/outputs/bundle/release/app-release.aab"}}, {name: "Upload debug symbols", uses: "actions/upload-artifact@v4", with: {name: "debug-symbols", path: "build/debug-info"}}]}}
