name: Build APK
on: {workflow_dispatch: null, push: {branches: [main]}}
jobs: {build: {runs-on: ubuntu-latest, steps: [{name: "Get code", uses: "actions/checkout@v4"}, {name: "Setup Java", uses: "actions/setup-java@v4", with: {distribution: "zulu", java-version: "17"}}, {name: "Setup Flutter", uses: "subosito/flutter-action@v2", with: {channel: "stable"}}, {name: "Add Android platform", run: "flutter create --platforms=android --org com.perimetr --project-name perimetr_native ."}, {name: "Get dependencies", run: "flutter pub get"}, {name: "Build debug APK", run: "flutter build apk --debug"}, {name: "Upload APK", uses: "actions/upload-artifact@v4", with: {name: "app-debug-apk", path: "build/app/outputs/flutter-apk/app-debug.apk"}}]}}
